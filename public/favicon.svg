<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252632" />
      <stop offset="50%" stop-color="#1c1d25" />
      <stop offset="100%" stop-color="#14141c" />
    </linearGradient>
    <linearGradient id="shibaFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffca68" />
      <stop offset="45%" stop-color="#f3a738" />
      <stop offset="100%" stop-color="#d98218" />
    </linearGradient>
    <linearGradient id="furDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df8719" />
      <stop offset="100%" stop-color="#b6650c" />
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e8" />
      <stop offset="50%" stop-color="#fca5b3" />
      <stop offset="100%" stop-color="#f38497" />
    </linearGradient>
    <linearGradient id="animeEyeIris" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211005" />
      <stop offset="40%" stop-color="#3d1d08" />
      <stop offset="70%" stop-color="#9a4d0e" />
      <stop offset="100%" stop-color="#e79026" />
    </linearGradient>
  </defs>

  <!-- Clean Dark App Squircle Base (No Red) -->
  <rect width="512" height="512" rx="116" fill="url(#appBg)" />
  <rect width="502" height="502" x="5" y="5" rx="111" fill="none" stroke="#3b3c4d" stroke-width="3" />

  <!-- Anime Doge Head -->
  <g id="anime-doge-head">
    <!-- Left Ear -->
    <path d="M 172 195 L 116 88 C 111 78, 125 70, 134 78 L 214 146 Z" fill="url(#furDark)" />
    <path d="M 166 198 L 122 94 C 119 86, 129 80, 136 86 L 208 148 Z" fill="url(#shibaFur)" />
    <path d="M 160 190 L 132 110 C 130 104, 137 101, 142 105 L 194 150 C 182 165, 172 178, 160 190 Z" fill="url(#earInner)" />

    <!-- Right Ear -->
    <path d="M 340 195 L 396 88 C 401 78, 387 70, 378 78 L 298 146 Z" fill="url(#furDark)" />
    <path d="M 346 198 L 390 94 C 393 86, 383 80, 376 86 L 304 148 Z" fill="url(#shibaFur)" />
    <path d="M 352 190 L 380 110 C 382 104, 375 101, 370 105 L 318 150 C 330 165, 340 178, 352 190 Z" fill="url(#earInner)" />

    <!-- Head Base -->
    <path d="M 148 200 C 120 230, 95 285, 115 340 C 125 365, 150 395, 195 425 C 230 445, 282 445, 317 425 C 362 395, 387 365, 397 340 C 417 285, 392 230, 364 200 C 335 170, 305 160, 256 160 C 207 160, 177 170, 148 200 Z" fill="url(#shibaFur)" />

    <!-- Cheeks -->
    <path d="M 112 315 C 92 328, 96 348, 122 355 C 104 358, 108 375, 134 376 C 122 384, 132 396, 150 393" fill="url(#shibaFur)" />
    <path d="M 400 315 C 420 328, 416 348, 390 355 C 408 358, 404 375, 378 376 C 390 384, 380 396, 362 393" fill="url(#shibaFur)" />

    <!-- Urajiro -->
    <path d="M 152 300 C 142 350, 170 415, 215 428 C 235 434, 277 434, 297 428 C 342 415, 370 350, 360 300 C 348 290, 328 285, 308 300 C 285 315, 270 318, 256 318 C 242 318, 227 315, 204 300 C 184 285, 164 290, 152 300 Z" fill="#fffdf8" />

    <!-- Eyebrow Dots -->
    <ellipse cx="202" cy="225" rx="13" ry="9" fill="#fffdfa" transform="rotate(-8 202 225)" />
    <ellipse cx="310" cy="225" rx="13" ry="9" fill="#fffdfa" transform="rotate(8 310 225)" />

    <!-- Left Eye -->
    <g>
      <ellipse cx="198" cy="272" rx="26" ry="30" fill="#ffffff" />
      <ellipse cx="199" cy="272" rx="23" ry="28" fill="url(#animeEyeIris)" />
      <ellipse cx="199" cy="272" rx="13" ry="17" fill="#120803" />
      <circle cx="189" cy="258" r="9" fill="#ffffff" />
      <circle cx="211" cy="281" r="5" fill="#ffffff" />
      <path d="M 166 265 C 176 242, 216 242, 228 262" stroke="#21120a" stroke-width="5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="314" cy="272" rx="26" ry="30" fill="#ffffff" />
      <ellipse cx="313" cy="272" rx="23" ry="28" fill="url(#animeEyeIris)" />
      <ellipse cx="313" cy="272" rx="13" ry="17" fill="#120803" />
      <circle cx="303" cy="258" r="9" fill="#ffffff" />
      <circle cx="325" cy="281" r="5" fill="#ffffff" />
      <path d="M 346 265 C 336 242, 296 242, 284 262" stroke="#21120a" stroke-width="5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Blush -->
    <ellipse cx="152" cy="322" rx="19" ry="10" fill="#ff7f8a" opacity="0.65" />
    <ellipse cx="360" cy="322" rx="19" ry="10" fill="#ff7f8a" opacity="0.65" />

    <!-- Nose -->
    <path d="M 243 324 C 241 316, 250 312, 256 312 C 262 312, 271 316, 269 324 C 267 334, 259 339, 256 339 C 253 339, 245 334, 243 324 Z" fill="#1f1a18" />
    <ellipse cx="253" cy="317" rx="4.5" ry="2.2" fill="#ffffff" opacity="0.75" />

    <!-- Mouth -->
    <line x1="256" y1="339" x2="256" y2="349" stroke="#3d2616" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 226 352 C 234 362, 248 362, 256 349 C 264 362, 278 362, 286 352" stroke="#3d2616" stroke-width="3.6" stroke-linecap="round" fill="none" />
    <path d="M 250 357 C 250 367, 262 367, 262 357 Z" fill="#ff7b89" />
  </g>
</svg>
